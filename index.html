<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INFINITY VISION</title>
<meta name="theme-color" content="#0D1B34">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F9;--sf:#fff;--ink:#101B2E;--mut:#5A6A7F;--line:#E0E5EC;--acc:#1F4FD1;--accs:#E8EEFC;--onacc:#fff;--navy:#0D1B34;--ok:#0B7A52;--oks:#DFF3E9;--bad:#B42323;--bads:#FBE8E8;--idle:#ECEFF4;--sh:0 1px 2px rgba(16,27,46,.05);--shl:0 18px 48px rgba(10,20,40,.22);--r:12px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1120;--sf:#111C31;--ink:#E7EDF8;--mut:#93A3BC;--line:#1F2D48;--acc:#6F9BFF;--accs:#182A55;--onacc:#0A1530;--navy:#0B1730;--ok:#4ADE9A;--oks:#0F2E24;--bad:#FF8F8F;--bads:#3A1618;--idle:#17233D;--sh:0 1px 2px rgba(0,0,0,.3);--shl:0 18px 48px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1120;--sf:#111C31;--ink:#E7EDF8;--mut:#93A3BC;--line:#1F2D48;--acc:#6F9BFF;--accs:#182A55;--onacc:#0A1530;--navy:#0B1730;--ok:#4ADE9A;--oks:#0F2E24;--bad:#FF8F8F;--bads:#3A1618;--idle:#17233D;--sh:0 1px 2px rgba(0,0,0,.3);--shl:0 18px 48px rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Manrope,Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1{font-size:1.6rem;margin:0;letter-spacing:-.02em;font-weight:800}h2{font-size:1.3rem;margin:.2em 0 .1em;font-weight:800;letter-spacing:-.015em}h3{font-size:1.02rem;margin:.9em 0 .4em;font-weight:700}
h4{margin:20px 0 4px;font-size:.78rem;font-weight:700;color:var(--mut)}
p{margin:.3em 0}.mut{color:var(--mut)}.sm{font-size:.85rem}
label{display:block;font-size:.8rem;font-weight:700;color:var(--ink);margin:16px 0 6px}
input,select{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--sf);color:var(--ink);font:inherit;outline:none;min-height:46px;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#8896AB}
input:focus,select:focus,.pre:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--accs)}
select[multiple]{padding:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--acc);color:var(--onacc);border:1px solid transparent;border-radius:10px;padding:0 20px;min-height:46px;font:700 .92rem Manrope,Inter,system-ui,sans-serif;cursor:pointer;transition:filter .15s,transform .1s,background .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.985)}.btn:disabled{opacity:.5;cursor:default}.btn svg{width:18px;height:18px}
.btn.wa{background:#1B9F52;color:#fff}.btn.ghost{background:var(--sf);color:var(--ink);border-color:var(--line)}.btn.ghost:hover{background:var(--idle);filter:none}
.btn.danger{background:var(--bad);color:#fff}.btn.full{width:100%;margin-top:14px}.btn.sm2{min-height:34px;padding:0 13px;font-size:.8rem;border-radius:8px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ib{background:var(--sf);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;color:inherit;cursor:pointer;transition:background .15s}.ib:hover{background:var(--idle)}.ib svg{width:19px;height:19px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}.lnk{background:none;border:0;color:var(--acc);font:inherit;font-weight:700}
.card,.panel{background:var(--sf);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);margin:14px 0;overflow:hidden}.pad,.panel{padding:20px}
.ph{margin:4px 0 16px}.ph p{color:var(--mut)}
/* ---- top bar ---- */
.top{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--sf);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:15;min-height:64px}
.top.dark{background:var(--navy);color:#fff;border-color:transparent}.top.dark .ib{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18);color:#fff}.top.dark .ib:hover{background:rgba(255,255,255,.14)}
.mb{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.1em;font-size:.82rem;color:var(--acc);line-height:1.15}.top.dark .mb{color:#8FB2FF}.mb b{color:var(--ink)}.top.dark .mb b{color:#fff}.mb svg{width:36px;flex:none}
.who{display:flex;align-items:center;gap:10px}.av{width:36px;height:36px;border-radius:10px;background:var(--accs);color:var(--acc);display:grid;place-items:center;font-weight:800}.top.dark .av{background:rgba(255,255,255,.12);color:#fff}
.wn b{display:block;font-size:.86rem;line-height:1.15;font-weight:700}.wn span{font-size:.74rem;opacity:.7}
.content{padding:20px 16px 100px;max-width:1040px;margin:0 auto}
/* ---- navigation ---- */
.side{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sf);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}.side .sb{display:none}.nv{display:flex;overflow-x:auto;scrollbar-width:none}
.nv button{flex:1;min-width:58px;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--mut);font:700 10.5px Manrope,Inter,sans-serif;padding:7px 4px;border-radius:10px;cursor:pointer}.nv svg{width:22px;height:22px}.nv button.on{color:var(--acc);background:var(--accs)}
@media(min-width:900px){
.layout{display:grid;grid-template-columns:252px 1fr}
.side{position:sticky;top:0;height:100vh;background:var(--navy);border:0;padding:22px 14px}
.side .sb{display:block;color:#fff;padding:6px 12px 26px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}.sb .mb{color:#8FB2FF;font-size:.95rem}.sb .mb b{color:#fff}.sb .mb svg{width:42px}
.nv{flex-direction:column;gap:2px;overflow:visible}
.nv button{flex:none;flex-direction:row;gap:12px;font-size:.9rem;font-weight:600;padding:11px 14px;color:#A6B7D4;border-radius:10px;transition:background .15s,color .15s}.nv button svg{width:19px;height:19px;opacity:.85}
.nv button:hover{background:rgba(255,255,255,.06);color:#fff}.nv button.on{background:rgba(255,255,255,.1);color:#fff}.nv button.on svg{color:#8FB2FF;opacity:1}
.layout .top .mb{display:none}.content{padding:30px 36px}}
/* ---- sign in ---- */
.login{min-height:100vh;display:grid;background:var(--bg)}
.lbrand{background:var(--navy);background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;color:#fff;padding:48px 28px 72px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.lbrand svg{width:76px;color:#8FB2FF;margin-bottom:6px}.lbrand h1{letter-spacing:.14em;font-size:1.55rem}.lbrand p{color:#A9BBDD;max-width:330px;font-size:1rem}
.lform{margin:-38px auto 32px;width:min(430px,92%);padding:28px;border-radius:16px;box-shadow:var(--shl)}
@media(min-width:900px){.login{grid-template-columns:1.05fr 1fr}.lbrand{padding:72px}.lbrand svg{width:92px}.lbrand h1{font-size:1.9rem}.lform{margin:auto;width:min(400px,88%);box-shadow:none;border:0;background:none;padding:0;overflow:visible}.lform h2{font-size:1.6rem}}
.pre{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--sf);transition:border-color .15s,box-shadow .15s}.pre span{padding-left:14px;color:var(--mut);font-weight:700}.pre input{border:0;box-shadow:none!important;background:none}
/* ---- search ---- */
.hero{background:var(--navy);background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:32px 32px;color:#fff;border-radius:14px;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero span{font-size:.82rem;font-weight:600;color:#A9BBDD}.hero b{display:block;font-size:2.4rem;line-height:1.1;letter-spacing:-.02em;font-weight:800}
.ghost2{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:9px;padding:9px 13px;font:700 .8rem Manrope,Inter,sans-serif;display:flex;gap:6px;align-items:center;cursor:pointer;transition:background .15s}.ghost2:hover{background:rgba(255,255,255,.18)}.ghost2 svg{width:16px}
.sc{padding:18px}
.seg{display:flex;background:var(--idle);border-radius:10px;padding:4px;gap:4px}.seg button{flex:1;border:0;background:none;color:var(--mut);padding:9px 4px;border-radius:7px;font:700 .85rem Manrope,Inter,sans-serif;cursor:pointer;transition:background .15s,color .15s}.seg button.on{background:var(--sf);color:var(--ink);box-shadow:0 1px 3px rgba(16,27,46,.14)}
.inp{position:relative;margin-top:14px}
.inp:before{content:"IND";position:absolute;left:2px;top:2px;bottom:2px;width:34px;border-radius:8px 0 0 8px;background:#1F4FD1;color:#fff;font:700 9px/1 Manrope,sans-serif;letter-spacing:.06em;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;z-index:1;pointer-events:none}
.inp input{background:#fff;color:#0E1A2E;border:2px solid #0E1A2E;border-radius:10px;font:700 1.55rem/1 "Barlow Semi Condensed",Manrope,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:16px 50px 16px 50px;min-height:62px}
.inp input::placeholder{font:600 .95rem Manrope,sans-serif;letter-spacing:0;text-transform:none;color:#8896AB}
.inp input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accs)}
.inp .x{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:#E9EDF3;color:#4B5B72;width:32px;height:32px;border-radius:50%;font-size:1.15rem;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chip{border:1px solid var(--line);background:var(--sf);color:var(--ink);border-radius:8px;padding:6px 12px;font:700 .8rem Manrope,Inter,sans-serif;cursor:pointer;letter-spacing:.04em;transition:background .15s}.chip:hover{background:var(--idle)}
.rh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 2px 4px;flex-wrap:wrap}.rh select{width:auto;min-height:40px}
.vc{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0;box-shadow:var(--sh)}
.vt{font-weight:800;font-size:1.08rem;margin:14px 0 10px;letter-spacing:-.01em}
.kvs{display:grid;grid-template-columns:1fr 1fr;gap:12px}.kvs span{display:block;font-size:.76rem;font-weight:600;color:var(--mut)}.kvs b{font-size:.92rem;font-weight:700;word-break:break-word}
.rl{column-width:250px;column-gap:8px;margin-top:8px}
.rli{break-inside:avoid;margin:0 0 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:50px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--sf);color:var(--ink);cursor:pointer;box-shadow:var(--sh);transition:background .12s,border-color .12s}
.rli span{font:700 1.2rem/1 "Barlow Semi Condensed",Manrope,sans-serif;letter-spacing:.13em}.rli i{font-style:normal;font-size:1.5rem;color:var(--mut);line-height:1}
.rli:hover{background:var(--idle)}.rli:active{border-color:var(--acc);background:var(--accs)}
.meta{margin-top:12px;font-size:.78rem;color:var(--mut)}
.plate{display:inline-flex;align-items:stretch;border:2px solid #0E1A2E;border-radius:8px;background:#fff;color:#0E1A2E;overflow:hidden}
.plate i{background:#1F4FD1;color:#fff;font:700 8px/1 Manrope,sans-serif;letter-spacing:.06em;display:flex;align-items:flex-end;padding:5px 5px;font-style:normal}
.plate b{font:700 1.7rem/1 "Barlow Semi Condensed",Manrope,sans-serif;letter-spacing:.14em;padding:8px 14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:.76rem;font-weight:700;background:var(--idle);color:var(--mut)}.pill.ok{background:var(--oks);color:var(--ok)}.pill.bad{background:var(--bads);color:var(--bad)}.pill.ok:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.empty{text-align:center;padding:40px 18px;border:1px dashed var(--line);border-radius:14px;margin-top:14px;background:var(--sf)}.empty svg{width:40px;color:var(--mut)}
/* ---- dashboard + tables ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:14px 0}
.kpi,.stat{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--sh);display:flex;gap:14px;align-items:center}.stat{display:block}
.stat b,.kpi b{display:block;font-size:1.55rem;line-height:1.1;font-weight:800;letter-spacing:-.02em}.stat span,.kpi span{color:var(--mut);font-size:.82rem;font-weight:600}
.ki{width:42px;height:42px;border-radius:10px;background:var(--accs);color:var(--acc);display:grid;place-items:center;flex:none}.ki svg{width:21px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px;margin-bottom:14px}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font-size:.76rem;font-weight:700;color:var(--mut);background:var(--idle);text-align:left}
th,td{padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}td{font-weight:500}
tr:last-child td{border-bottom:0}tbody tr:hover td,tr:hover>td{background:color-mix(in srgb,var(--idle) 55%,transparent)}
/* ---- dialogs + toast ---- */
.ov{position:fixed;inset:0;background:rgba(8,15,30,.6);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .18s ease-out}
.box{background:var(--sf);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:22px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));box-shadow:var(--shl);animation:rise .22s ease-out}
@media(min-width:700px){.ov{align-items:center}.box{border-radius:18px}}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.kv>span:first-child{font-size:.88rem}.kv span:last-child{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:6px;text-align:right;word-break:break-word;font-weight:700}
.box h4{margin:20px 0 2px;color:var(--acc);font-size:.8rem}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:90px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:all .25s;z-index:99;max-width:90vw;font-weight:600;box-shadow:var(--shl)}#toast.show{opacity:1;transform:translateX(-50%)}#toast.bad{background:var(--bad);color:#fff}
progress{width:100%;height:8px;accent-color:var(--acc)}
body{overscroll-behavior-y:contain}
/* location history + all-staff map */
.mapov{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);animation:fade .18s}
.mapbar{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--sf);border-bottom:1px solid var(--line);flex-wrap:wrap}.mapbar select,.mapbar input[type=date]{min-height:40px;padding:6px 10px}
.mapbox{position:relative;flex:1;min-height:200px;isolation:isolate}.mapbox>div{position:absolute;inset:0}
.mapside{max-height:44vh;overflow:auto;background:var(--sf);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px))}
.hst{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.hst div{background:var(--idle);border-radius:10px;padding:8px 10px}.hst b{display:block;font-size:1rem}.hst span{font-size:.7rem;color:var(--mut);font-weight:600}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:.74rem;color:var(--mut);font-weight:600;margin:10px 0}.leg i{display:inline-block;width:18px;height:4px;border-radius:3px;vertical-align:middle;margin-right:5px}
.smk{width:34px;height:34px;border-radius:50%;border:3px solid #fff;color:#fff;font:800 12px/28px Manrope,sans-serif;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.smn{position:absolute;left:50%;top:38px;transform:translateX(-50%);background:#0D1B34;color:#fff;font:700 11px/1 Manrope,sans-serif;padding:3px 7px;border-radius:6px;white-space:nowrap}
.stp{width:26px;height:26px;border-radius:50%;border:2px solid #fff;color:#fff;font:800 12px/22px Manrope,sans-serif;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.mvd{width:18px;height:18px;border-radius:50%;background:#F59E0B;border:3px solid #fff;box-shadow:0 0 0 6px rgba(245,158,11,.3)}
/* staff movement timeline */
.tlv .mapside{max-height:50vh;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media(min-width:900px){.mapov.tlv{display:grid;grid-template-columns:minmax(0,1fr) 420px;grid-template-rows:auto minmax(0,1fr)}.tlv .mapbar{grid-column:1/-1}.tlv .mapbox{grid-column:1;grid-row:2;min-height:0}.tlv .mapside{grid-column:2;grid-row:2;max-height:none;height:100%;border-top:0;border-left:1px solid var(--line)}}
.tlh{display:flex;align-items:center;gap:12px;margin-bottom:14px}.tlh b{display:block;font-size:1.02rem;line-height:1.2}
.tsum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.tsum>div{background:var(--idle);border-radius:10px;padding:10px 12px;min-width:0}.tsum span{display:block;font-size:.7rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}.tsum b{display:block;font-size:1.05rem;margin:1px 0 2px}
.pl{font-size:.78rem;color:var(--mut);line-height:1.35;word-break:break-word;font-style:normal}
.tl{margin:6px 0 0}.ti{display:flex;gap:8px;padding:6px 6px 2px;border-radius:10px;cursor:pointer}.ti:hover{background:var(--idle)}
.tt{width:58px;flex:none;font-size:.78rem;font-weight:700;color:var(--mut);padding-top:4px}
.tc{position:relative;flex:none;width:28px;display:flex;justify-content:center}.tc:before{content:"";position:absolute;top:30px;bottom:-8px;left:50%;width:2px;margin-left:-1px;background:var(--line)}.ti:last-child .tc:before{display:none}
.td{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;color:#fff;font:800 12px/28px Manrope,sans-serif;text-align:center}
.tb{flex:1;min-width:0;padding:3px 0 12px}.tb>b{display:block;font-size:.9rem;line-height:1.3}.tb .mt{font-size:.78rem;color:var(--mut);font-weight:600}
.ti.lg{padding-top:0;padding-bottom:0}.ti.lg .tc{align-items:center}.ti.lg .td{width:10px;height:10px;margin-top:9px;background:var(--line)!important}.ti.lg .tc:before{top:0;bottom:0}.ti.lg .tb{padding:2px 0 4px}.ti.lg .tb>b{font-size:.78rem;color:var(--mut);font-weight:700}
/* premium polish */
.top:not(.dark){background:color-mix(in srgb,var(--sf) 80%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5)}
@media(max-width:899px){.side{background:color-mix(in srgb,var(--sf) 82%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5)}}
.btn:not(.ghost):not(.wa):not(.danger){box-shadow:0 8px 18px -8px color-mix(in srgb,var(--acc) 75%,transparent)}.btn.wa{box-shadow:0 8px 18px -8px rgba(27,159,82,.7)}
.box::before{content:"";display:block;width:42px;height:4px;border-radius:4px;background:var(--line);margin:-10px auto 14px}
.rl .rli{animation:rowin .3s cubic-bezier(.2,.8,.2,1) both}
